name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - goo-engine-v4.4-release

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 Release (CUDA + OptiX)
    runs-on: vms
    timeout-minutes: 180
    env:
      BUILD_DIR: ${{ github.workspace }}\build
      BUILD_TYPE: Release
      CUDA_VERSION: "12.8.1"
      CUDA_VERSION_SHORT: "12.8"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Clean workspace
        shell: pwsh
        run: |
          if (Test-Path "${{ github.workspace }}\*") {
            Remove-Item -Recurse -Force "${{ github.workspace }}\*"
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: true
          lfs: false

      - name: Pull all LFS files
        shell: pwsh
        run: |
          git lfs install --local
          # Fetch LFS objects from upstream Blender (repo was detached from fork network,
          # so GitHub LFS storage is empty - Blender's Gitea has 5663/5664 objects)
          git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git lfs pull
          # splash.png is goo-engine-specific (not in Blender upstream), use Blender's default
          git config lfs.url https://github.com/Imperialorg/goo-engine.git/info/lfs
          # Generate a placeholder splash if the LFS object is missing
          $splashFile = "release/datafiles/splash.png"
          $content = Get-Content $splashFile -Raw -ErrorAction SilentlyContinue
          if ($content -match "^version https://git-lfs") {
            Write-Host "splash.png is still an LFS pointer - creating 1x1 placeholder PNG"
            # Minimal valid PNG (1x1 transparent pixel)
            $pngBytes = [byte[]]@(0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A,0x00,0x00,0x00,0x0D,0x49,0x48,0x44,0x52,
              0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x01,0x08,0x06,0x00,0x00,0x00,0x1F,0x15,0xC4,
              0x89,0x00,0x00,0x00,0x0A,0x49,0x44,0x41,0x54,0x78,0x9C,0x62,0x00,0x00,0x00,0x02,
              0x00,0x01,0xE5,0x27,0xDE,0xFC,0x00,0x00,0x00,0x00,0x49,0x45,0x4E,0x44,0xAE,0x42,
              0x60,0x82)
            [System.IO.File]::WriteAllBytes((Resolve-Path $splashFile), $pngBytes)
          }

      - name: Cache lib/windows_x64 (LFS)
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: lib/windows_x64
          key: win-libs-${{ hashFiles('.gitmodules') }}-${{ hashFiles('build_files/build_environment/cmake/versions.cmake') }}
          restore-keys: |
            win-libs-

      - name: Checkout Windows x64 libraries (with LFS)
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git config --local submodule.lib/windows_x64.update checkout
          $env:GIT_LFS_SKIP_SMUDGE = "1"
          git submodule update --progress --init lib/windows_x64
          Remove-Item Env:\GIT_LFS_SKIP_SMUDGE
          Push-Location lib/windows_x64
          git lfs pull
          Pop-Location

      - name: Checkout assets
        shell: pwsh
        run: git submodule update --progress --init release/datafiles/assets

      - name: Cache CUDA Toolkit installation
        id: cache-cuda
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION_SHORT }}
          key: cuda-installed-${{ env.CUDA_VERSION }}

      - name: Cache build directory (Ninja incremental)
        id: cache-build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\build
          key: win-build-${{ github.sha }}
          restore-keys: |
            win-build-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install CUDA Toolkit
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        id: install-cuda
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION_SHORT }}"
          Write-Host "Installing CUDA Toolkit ${{ env.CUDA_VERSION }}..."
          $installerUrl = "https://developer.download.nvidia.com/compute/cuda/${{ env.CUDA_VERSION }}/network_installers/cuda_${{ env.CUDA_VERSION }}_windows_network.exe"
          $installerPath = "${{ runner.temp }}\cuda_installer.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
          Write-Host "Running CUDA installer (silent)..."
          $proc = Start-Process -FilePath $installerPath -ArgumentList "-s", "nvcc_${{ env.CUDA_VERSION_SHORT }}", "cudart_${{ env.CUDA_VERSION_SHORT }}", "visual_studio_integration_${{ env.CUDA_VERSION_SHORT }}" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "CUDA install failed with exit code $($proc.ExitCode)" }
          Write-Host "CUDA Toolkit installed successfully"

      - name: Set CUDA environment
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION_SHORT }}"
          echo "cuda_path=$cudaPath" >> $env:GITHUB_OUTPUT
          echo "$cudaPath\bin" >> $env:GITHUB_PATH

      - name: Cache OptiX SDK headers
        id: cache-optix
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\optix-dev
          key: optix-headers-v8.1.0

      - name: Install OptiX SDK (headers only)
        id: install-optix
        shell: pwsh
        run: |
          $optixDir = "${{ github.workspace }}\optix-dev"
          if (Test-Path "$optixDir\include\optix.h") {
            Write-Host "OptiX headers restored from cache"
          } else {
            Write-Host "Cloning OptiX 8.1.0 headers..."
            git clone https://github.com/NVIDIA/optix-dev.git $optixDir
            Push-Location $optixDir
            git checkout 50021ea0af6d41609a97777ceebbdf1e1d34efe7
            Pop-Location
          }
          if (-not (Test-Path "$optixDir\include\optix.h")) {
            throw "OptiX headers not found after clone"
          }
          if (-not (Test-Path "$optixDir\include\internal\optix_device_impl.h")) {
            throw "OptiX internal headers missing"
          }
          Write-Host "OptiX 8.1.0 headers ready"
          echo "optix_root=$optixDir" >> $env:GITHUB_OUTPUT

      - name: Detect Visual Studio
        id: detect-vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio not found" }
          Write-Host "Found VS at: $vsPath"
          # Verify Ninja is available
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw "Ninja not found in PATH" }

      - name: Configure CMake
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" amd64
          cmake -G Ninja ^
            -S "${{ github.workspace }}" ^
            -B "%BUILD_DIR%" ^
            -C "${{ github.workspace }}\build_files\cmake\config\blender_release.cmake" ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DWITH_WINDOWS_SCCACHE=ON ^
            -DWITH_CYCLES=ON ^
            -DWITH_CYCLES_DEVICE_CUDA=ON ^
            -DWITH_CYCLES_DEVICE_OPTIX=ON ^
            -DWITH_CYCLES_CUDA_BINARIES=ON ^
            -DWITH_CUDA_DYNLOAD=ON ^
            -DCYCLES_CUDA_BINARIES_ARCH="sm_52;sm_60;sm_61;sm_70;sm_75;sm_86;sm_89;sm_120;compute_75" ^
            -DOPTIX_ROOT_DIR="${{ steps.install-optix.outputs.optix_root }}"
          if errorlevel 1 exit /b 1

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" amd64
          ninja -C "%BUILD_DIR%" -j 96 install
          if errorlevel 1 exit /b 1

      - name: Show sccache stats
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows-x64
          path: ${{ github.workspace }}\build\bin\
          retention-days: 14
          if-no-files-found: error
